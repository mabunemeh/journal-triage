name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Test (Linux with race detector)
        if: runner.os == 'Linux'
        run: go test -race -count=1 -cover ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 -cover ./...
      - name: Build and run demo
        run: |
          go build -o dist/journal-triage.exe ./cmd/journal-triage
          ./dist/journal-triage.exe examples/demo.jsonl > actual.txt
          diff -u internal/triage/testdata/demo.txt actual.txt
          ./dist/journal-triage.exe --format json examples/demo.jsonl
      - name: Static Linux build
        if: runner.os == 'Linux'
        run: CGO_ENABLED=0 GOOS=linux go build -o dist/journal-triage ./cmd/journal-triage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pre-commit
      - run: pre-commit run gitleaks-history --hook-stage manual --all-files
